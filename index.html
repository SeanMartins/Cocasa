<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoCasa</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoCasa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --text:#16201d; --muted:#6b7a75; --line:#e3e8e6;
  --brand:#0f766e; --brand-2:#14b8a6; --pos:#15803d; --neg:#c2410c; --late:#b91c1c; --soon:#b45309;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1412;--card:#16201d;--text:#e7efec;--muted:#8fa29b;--line:#24312d;--pos:#4ade80;--neg:#fb923c;--late:#f87171;--soon:#fbbf24;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
.hidden{display:none!important}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 10px}
h3.sec{margin:18px 4px 8px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:12.5px} .pos{color:var(--pos)} .neg{color:var(--neg)} .danger{color:var(--late)!important}

/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login img{width:84px;margin-bottom:12px}
#login h1{margin:0 0 6px}
#login p{max-width:320px;margin:0 0 24px}

/* layout */
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:17px}
header select{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:15px}
header select option{color:#000}
#app.empty header select{display:none}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#app.empty nav{display:none}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.active{color:var(--brand)}
#fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(15,118,110,.4);z-index:6}

/* components */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero h2{margin-top:0}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head-row h3{margin:0}
.card .head-row{margin-bottom:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi.wide{margin-bottom:6px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:19px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap}
.row.late .s{color:var(--late)} .row.soon .s{color:var(--soon)} .row.done{opacity:.6}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ico.income{background:#dcfce7;color:#15803d}.ico.expense{background:#ffedd5;color:#c2410c}.ico.maintenance{background:#e0e7ff;color:#4338ca}.ico.transfer{background:#f1f5f9;color:#475569}
.amt.income{color:var(--pos)} .amt.expense,.amt.maintenance{color:var(--neg)}
.warn{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--brand);font-size:13px;padding:0;cursor:pointer}
.year{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 8px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}

/* forms */
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea,.inline input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
.inline{display:flex;gap:8px;align-items:center}
.inline input{margin:0;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.share-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.share-row span{flex:1;min-width:0}
.share-row small{display:block;color:var(--muted);font-size:11.5px}
.share-row input{width:90px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:8px;font-size:16px;text-align:right}
.share-row em{font-style:normal;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.file{display:inline-block;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:17px}
.x{background:var(--bg);border:0;border-radius:50%;width:32px;height:32px;color:var(--text);font-size:15px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.actions .btn:last-child{flex:1}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img,.viewer iframe{max-width:100%;max-height:100%;background:#fff;border:0}
.viewer iframe{width:100%;height:100%}
.viewer .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16201d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
</head>
<body>

<div id="login" class="hidden">
  <img src="icon.svg" alt="">
  <h1>CoCasa</h1>
  <p class="muted">Affitti, spese, manutenzioni e scadenze dell'immobile che hai in comproprietà, condivisi con il tuo socio.</p>
  <button id="btnLogin" class="btn">Accedi con Google</button>
</div>

<div id="app" class="hidden">
  <header>
    <b>CoCasa</b>
    <select id="propSel" aria-label="Immobile"></select>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="Aggiungi">+</button>
  <nav>
    <button data-tab="dash" class="active"><span>🏠</span>Riepilogo</button>
    <button data-tab="moves"><span>💶</span>Movimenti</button>
    <button data-tab="sched"><span>📅</span>Scadenze</button>
    <button data-tab="report"><span>📊</span>Report</button>
    <button data-tab="settings"><span>⚙️</span>Impostazioni</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
<div id="viewer" class="viewer hidden"><button class="x" id="viewerClose">✕</button><div id="viewerBody" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div></div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
